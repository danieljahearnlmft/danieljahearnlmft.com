[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/services-page"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services-page/"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/visualizations"
  to = "/visualization"
  status = 301

[[redirects]]
  from = "/visualizations/"
  to = "/visualization"
  status = 301

# Merged into /attachment-therapy-adults (October 2026)
[[redirects]]
  from = "/healing-attachment-wounds"
  to = "/attachment-therapy-adults/#healing-attachment-wounds"
  status = 301

[[redirects]]
  from = "/healing-attachment-wounds/*"
  to = "/attachment-therapy-adults/#healing-attachment-wounds"
  status = 301

[[redirects]]
  from = "/earned-secure-attachment"
  to = "/attachment-therapy-adults/#earned-secure-attachment"
  status = 301

[[redirects]]
  from = "/earned-secure-attachment/*"
  to = "/attachment-therapy-adults/#earned-secure-attachment"
  status = 301

# Men's groups are paused. Temporary redirect so old links land on therapy and fees.
[[redirects]]
  from = "/mens-work"
  to = "/services/"
  status = 302

[[redirects]]
  from = "/mens-work/*"
  to = "/services/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404
